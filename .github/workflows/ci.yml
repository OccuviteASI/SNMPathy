name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]  # macOS is not built or tested for now
        python: ["3.10", "3.13"]
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: CLI smoke test
        run: |
          snmpathy version
          snmpathy init-config smoke.yaml
          snmpathy ping 127.0.0.1 -n 1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t snmpathy:ci .
      - name: Start container and check health
        run: |
          docker run -d --name snmpathy -p 8080:8080 snmpathy:ci
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8080/healthz && exit 0
            sleep 2
          done
          docker logs snmpathy
          exit 1

  executables:
    name: executable / ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build standalone executable
        run: python scripts/build_executable.py --no-copy
      - name: Check the executable runs
        shell: bash
        env:
          SNMPATHY_GITHUB_TOKEN: ${{ github.token }}
        run: |
          exe=dist/SNMPathy; [ -f dist/SNMPathy.exe ] && exe=dist/SNMPathy.exe
          "$exe" version
          "$exe" ping 127.0.0.1 -n 1
          "$exe" self-update --check | tee check.txt  # HTTPS to GitHub works from the executable
          if [ "${{ runner.os }}" = "Windows" ]; then grep -q "progress window: yes" check.txt; fi
      - name: Check a restarted copy keeps working after the first one exits
        shell: bash
        run: |
          exe=dist/SNMPathy; [ -f dist/SNMPathy.exe ] && exe=dist/SNMPathy.exe
          "$exe" _spawn-check spawn.txt
          for i in $(seq 1 30); do [ -s spawn.txt ] && break; sleep 1; done
          cat spawn.txt || echo "no result: the restarted copy crashed"
          grep -qx "ok" spawn.txt
      - name: Check the web UI starts from the executable
        shell: bash
        run: |
          exe=dist/SNMPathy; [ -f dist/SNMPathy.exe ] && exe=dist/SNMPathy.exe
          printf "http_port: 18765\ndatabase: ci-smoke.db\nenable_syslog: false\n" > ci-smoke.yaml
          "$exe" serve --config ci-smoke.yaml --no-syslog > serve.log 2>&1 &
          pid=$!
          ok=""
          for i in $(seq 1 60); do
            if curl -fs http://127.0.0.1:18765/healthz; then ok=1; break; fi
            sleep 2
          done
          kill $pid 2>/dev/null || true
          [ -n "$ok" ] || { cat serve.log; exit 1; }
      - name: Build SNMPathy Collector (the small site app)
        run: python scripts/build_executable.py --collector
      - name: Check SNMPathy Collector reports to a running server
        shell: bash
        run: |
          exe=dist/SNMPathy; [ -f dist/SNMPathy.exe ] && exe=dist/SNMPathy.exe
          col=dist/SNMPathy-Collector; [ -f dist/SNMPathy-Collector.exe ] && col=dist/SNMPathy-Collector.exe
          "$col" version | tee col-version.txt
          grep -q "snmpathy-collector" col-version.txt
          "$exe" serve --config ci-smoke.yaml --no-syslog > serve2.log 2>&1 &
          spid=$!
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:18765/healthz && break; sleep 2; done
          created=$(curl -fs -X POST -H "Content-Type: application/json" -d '{"name":"ci-site"}' http://127.0.0.1:18765/api/collectors)
          token=$(echo "$created" | python -c "import json,sys; print(json.load(sys.stdin)['token'])")
          code=$(echo "$created" | python -c "import json,sys; print(json.load(sys.stdin)['install']['app'])")
          "$col" setup-code "$code"
          "$col" run --server http://127.0.0.1:18765 --token "$token" --state-dir col-state > collector.log 2>&1 &
          cpid=$!
          ok=""
          for i in $(seq 1 60); do
            if curl -fs http://127.0.0.1:18765/api/collectors | grep -q '"status": *"online"'; then ok=1; break; fi
            sleep 2
          done
          kill $cpid $spid 2>/dev/null || true
          [ -n "$ok" ] || { echo "collector never came online"; cat collector.log; cat serve2.log; exit 1; }
          echo "collector online"
      - name: Name the executables for the release and the collector downloads folder
        shell: bash
        run: |
          mkdir -p downloads
          case "${{ runner.os }}" in
            Windows) cp dist/SNMPathy.exe downloads/SNMPathy-windows.exe
                     cp dist/SNMPathy-Collector.exe downloads/SNMPathy-Collector-windows.exe ;;
            Linux)   cp dist/SNMPathy downloads/SNMPathy-linux
                     cp dist/SNMPathy-Collector downloads/SNMPathy-Collector-linux ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: SNMPathy-${{ runner.os }}
          path: downloads/*
          if-no-files-found: error

  # Every change to main publishes the executables as a GitHub release; the tray's
  # "Update SNMPathy" downloads them (snmpathy/selfupdate.py). Re-pushing the same version
  # replaces that version's release.
  release:
    name: publish release
    needs: executables
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 scripts/release_notes.py --version)
          python3 scripts/release_notes.py "$GITHUB_SHA" > notes.md
          ls -l downloads
          gh release delete "v$version" --cleanup-tag --yes || true
          gh release create "v$version" downloads/* --target "$GITHUB_SHA" --title "SNMPathy $version" \
            --notes-file notes.md --latest
