name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: CLI smoke test
        run: |
          snmpathy version
          snmpathy init-config smoke.yaml
          snmpathy ping 127.0.0.1 -n 1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t snmpathy:ci .
      - name: Start container and check health
        run: |
          docker run -d --name snmpathy -p 8080:8080 snmpathy:ci
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8080/healthz && exit 0
            sleep 2
          done
          docker logs snmpathy
          exit 1

  executables:
    name: executable / ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build standalone executable
        run: python scripts/build_executable.py --no-copy
      - name: Check the executable runs
        shell: bash
        env:
          SNMPATHY_GITHUB_TOKEN: ${{ github.token }}
        run: |
          exe=dist/SNMPathy; [ -f dist/SNMPathy.exe ] && exe=dist/SNMPathy.exe
          "$exe" version
          "$exe" ping 127.0.0.1 -n 1
          "$exe" self-update --check | tee check.txt  # HTTPS to GitHub works from the executable
          if [ "${{ runner.os }}" = "Windows" ]; then grep -q "progress window: yes" check.txt; fi
      - name: Name the executable for the collector downloads folder
        shell: bash
        run: |
          mkdir -p downloads
          case "${{ runner.os }}" in
            Windows) cp dist/SNMPathy.exe downloads/SNMPathy-windows.exe ;;
            macOS)   cp dist/SNMPathy downloads/SNMPathy-macos ;;
            Linux)   cp dist/SNMPathy downloads/SNMPathy-linux ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: SNMPathy-${{ runner.os }}
          path: downloads/*
          if-no-files-found: error

  # Every change to main publishes the executables as a GitHub release; the tray's
  # "Update SNMPathy" downloads them (snmpathy/selfupdate.py). Re-pushing the same version
  # replaces that version's release.
  release:
    name: publish release
    needs: executables
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 scripts/release_notes.py --version)
          python3 scripts/release_notes.py "$GITHUB_SHA" > notes.md
          ls -l downloads
          gh release delete "v$version" --cleanup-tag --yes || true
          gh release create "v$version" downloads/* --target "$GITHUB_SHA" --title "SNMPathy $version" \
            --notes-file notes.md --latest
