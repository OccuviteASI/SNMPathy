name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: CLI smoke test
        run: |
          snmpathy version
          snmpathy init-config smoke.yaml
          snmpathy ping 127.0.0.1 -n 1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t snmpathy:ci .
      - name: Start container and check health
        run: |
          docker run -d --name snmpathy -p 8080:8080 snmpathy:ci
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8080/healthz && exit 0
            sleep 2
          done
          docker logs snmpathy
          exit 1

  executables:
    name: executable / ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build standalone executable
        run: python scripts/build_executable.py --no-copy
      - name: Check the executable runs
        shell: bash
        run: |
          exe=dist/SNMPathy; [ -f dist/SNMPathy.exe ] && exe=dist/SNMPathy.exe
          "$exe" version
          "$exe" ping 127.0.0.1 -n 1
      - uses: actions/upload-artifact@v4
        with:
          name: SNMPathy-${{ runner.os }}
          path: dist/SNMPathy*
          if-no-files-found: error
