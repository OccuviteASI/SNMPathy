{% set c = check or {} %}
{% set o = c.options or {} %}
<div class="form-grid">
  <label class="field">Type<select name="type" id="check-type">
    {% for t, l in [('http', 'HTTP(S) / website'), ('icmp', 'Ping (ICMP)'), ('tcp', 'TCP port'), ('dns', 'DNS resolution'), ('snmp', 'SNMP agent')] %}<option value="{{ t }}" {{ 'selected' if (c.type or 'http') == t }}>{{ l }}</option>{% endfor %}
  </select></label>
  <label class="field">Name<input name="name" value="{{ c.name or '' }}" placeholder="Company website" data-empty="omit"></label>
  <label class="field wide"><span id="target-label">URL</span><input name="target" required value="{{ c.target or '' }}" placeholder="https://www.example.com/" id="check-target"></label>
  <label class="field ct ct-tcp ct-snmp">Port<input name="port" type="number" data-type="int" data-empty="null" value="{{ c.port or '' }}" min="1" max="65535"></label>
  <label class="field">Interval (seconds)<input name="interval" type="number" data-type="int" value="{{ c.interval or 60 }}" min="5"></label>
  <label class="field">Timeout (seconds)<input name="timeout" type="number" step="0.5" data-type="float" value="{{ c.timeout or 5 }}" min="0.5"></label>
  <label class="field">Retries before down<input name="retries" type="number" data-type="int" value="{{ c.retries if c.retries is not none else 2 }}" min="0" max="20"></label>
  <label class="field">Device <span class="hint">optional</span><select name="device_id" data-type="nullable"><option value="">None</option>{% for d in devices %}<option value="{{ d.id }}" {{ 'selected' if c.device_id == d.id }}>{{ d.name }}</option>{% endfor %}</select></label>
  <label class="field ct ct-http">Method<select name="options.method">{% for m in ['GET', 'HEAD', 'POST'] %}<option {{ 'selected' if (o.method or 'GET') == m }}>{{ m }}</option>{% endfor %}</select></label>
  <label class="field ct ct-http">Expected status<input name="options.expected_status" value="{{ o.expected_status or '200-399' }}" placeholder="200-399, 2xx, 200,204"></label>
  <label class="field ct ct-http">Keyword <span class="hint">must appear in body</span><input name="options.keyword" value="{{ o.keyword or '' }}"></label>
  <label class="field ct ct-http">Warn when certificate expires within (days)<input name="options.cert_expiry_days" type="number" data-type="int" value="{{ o.cert_expiry_days or '' }}" min="1"></label>
  <label class="check ct ct-http"><input type="checkbox" name="options.keyword_absent" {{ 'checked' if o.keyword_absent }}> Keyword must be absent</label>
  <label class="check ct ct-http"><input type="checkbox" name="options.verify_tls" {{ 'checked' if o.verify_tls is not defined or o.verify_tls }}> Verify TLS certificate</label>
  <label class="field ct ct-icmp">Packets per check<input name="options.count" type="number" data-type="int" value="{{ o.count or 1 }}" min="1" max="5"></label>
  <label class="field ct ct-dns">Expected address <span class="hint">optional</span><input name="options.expected" value="{{ o.expected or '' }}"></label>
  <label class="field ct ct-snmp">Community <span class="hint">if no device is linked</span><input name="options.community" value="{{ o.community or 'public' }}"></label>
  <label class="check"><input type="checkbox" name="public" {{ 'checked' if c.public }}> Show on the public status page</label>
  <label class="check"><input type="checkbox" name="enabled" {{ 'checked' if not check or c.enabled }}> Enabled</label>
</div>
