<script>
(() => {
  const hints = {
    windows: "Run in an elevated PowerShell on the site machine. It downloads the collector from this server, saves the token in %ProgramData%\\SNMPathy Collector\\collector.yaml and registers a startup task that restarts on failure.",
    linux: "Run on the site machine. It downloads the collector from this server (or installs the Python package), writes /etc/snmpathy/collector.yaml and enables a systemd service.",
    macos: "Run in Terminal on the site Mac. It installs a launchd daemon that starts at boot.",
    docker: "Host networking lets the collector reach the site's devices directly. Build the image from this repository first (docker build -t snmpathy .).",
    manual: "Run the downloaded SNMPathy Collector (or the snmpathy command) with these options. Add --insecure for a self-signed certificate, or --ca-file for a private CA.",
  };
  function copyButton(box) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "btn sm copy"; b.textContent = "Copy";
    b.addEventListener("click", async () => {
      const text = box.dataset.text;
      try { await navigator.clipboard.writeText(text); SP.toast("Copied"); }
      catch (e) { const r = document.createRange(); r.selectNodeContents(box); const s = getSelection(); s.removeAllRanges(); s.addRange(r); SP.toast("Press Ctrl+C to copy"); }
    });
    box.appendChild(b);
  }
  function setBox(box, text) { box.textContent = text; box.dataset.text = text; copyButton(box); }
  // Same format as collector_app.encode_setup_code: base64url of {"s": server, "t": token}.
  SP.setupCode = function (server, token) {
    const json = JSON.stringify({ s: server.replace(/\/+$/, ""), t: token });
    const b64 = btoa(unescape(encodeURIComponent(json))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    return "SNMPATHY-SETUP-1:" + b64;
  };
  SP.showCollectorToken = function (r, doneHref) {
    const modal = SP.$("#token-modal");
    let os = /Mac/.test(navigator.platform) ? "macos" : /Linux/.test(navigator.platform) ? "linux" : "windows";
    const server = SP.$("#tok-server");
    const base = r.server || "";
    const current = () => (server.value.trim() || base).replace(/\/+$/, "");
    // The install commands carry the server address: swap it for the one chosen here.
    const withServer = (text) => (base ? text.split(base).join(current()) : text);
    const show = (pick) => {
      os = pick || os;
      SP.$$("#tok-tabs button").forEach((b) => b.classList.toggle("on", b.dataset.os === os));
      setBox(SP.$("#tok-cmd"), withServer(r.install[os]));
      SP.$("#tok-hint").textContent = hints[os];
    };
    const update = () => {
      setBox(SP.$("#tok-setup"), base ? SP.setupCode(current(), r.token) : r.install.app);
      show();
    };
    server.value = base;
    SP.$("#tok-servers").innerHTML = (r.servers || []).map((u) => `<option value="${SP.esc(u)}">`).join("");
    SP.$("#tok-server-note").textContent = r.opened_on_server
      ? "You opened SNMPathy on the server itself (localhost), so this is the server's network address. Change it if the site reaches the server another way (VPN, public address or a name)."
      : "The address you opened SNMPathy with. Change it if the site reaches the server another way (VPN, public address or a name).";
    server.oninput = update;
    setBox(SP.$("#tok-token"), r.token);
    SP.$$("#tok-tabs button").forEach((b) => (b.onclick = () => show(b.dataset.os)));
    update();
    SP.$("#tok-done").href = doneHref || location.pathname;
    SP.openModal(modal);
  };
})();
</script>
