[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snmpathy"
version = "0.6.2"
description = "Self-hosted network monitoring: SNMP polling, syslog ingest, and uptime/SLA reporting."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "pysnmp>=7.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
build = ["pyinstaller>=6.0"]
# System-tray icon (bundled in the executables)
tray = ["pystray>=0.19", "Pillow>=10"]

[project.scripts]
snmpathy = "snmpathy.cli:main"

[tool.setuptools.packages.find]
include = ["snmpathy*"]

[tool.setuptools.package-data]
snmpathy = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
